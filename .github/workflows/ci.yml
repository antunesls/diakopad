name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Sem JACK/ALSA no runner: jackgraph e midi já degradam para no-op,
      # do mesmo jeito que no desenvolvimento local sem motor de áudio.
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r backend/requirements.lock
          pip install httpx ruff==0.15.0
      - name: Lint
        run: ruff check backend
      - name: Testes
        working-directory: backend
        run: python -m unittest discover tests
      - name: Testes da interface
        run: python -m unittest discover -s frontend/tests

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning deploy/*.sh

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Testar cálculo de versão de release
        run: bash android/scripts/test-release-version.sh
      - name: Testes e APK Android
        working-directory: android
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: diakopad-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
