# systemd drop-in: LV2 plugin environment.
#
# 1. LV2_PATH: the image's custom lilv only scans
#    /usr/local/lib/aarch64-linux-gnu/lv2 by default, but the real plugins
#    live in /usr/local/lib/lv2 (139 bundles: x42, Surge XT, ...) and the
#    mda suite installs to /usr/lib/lv2 (apt mda-lv2). All three dirs are
#    required: the master's lvtk "Volume" + the per-pad effects catalog.
#
# 2. Master gain LV2 (lvtk "Volume", discovered on-device via lv2ls/lv2info
#    — stereo amplifier, control port "volume" in dB, no latency).
#    Range -60..0 dB = pure attenuation (100% slider = unity gain), safe
#    for PA.
# Install to /etc/systemd/system/diakopad.service.d/master.conf
[Service]
Environment=LV2_PATH=/usr/local/lib/lv2:/usr/local/lib/aarch64-linux-gnu/lv2:/usr/lib/lv2
Environment=DIAKOPAD_FX_MASTER_GAIN_LV2_URI=http://lvtk.org/plugins/volume
Environment=DIAKOPAD_FX_MASTER_GAIN_SYMBOL=volume
Environment=DIAKOPAD_FX_MASTER_GAIN_MIN=-60
Environment=DIAKOPAD_FX_MASTER_GAIN_MAX=0
Environment=DIAKOPAD_FX_MASTER_GAIN_IN_PORTS=input_1,input_2
Environment=DIAKOPAD_FX_MASTER_GAIN_OUT_PORTS=output_1,output_2
