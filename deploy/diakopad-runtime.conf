# systemd drop-in: runtime identity for the app.
#
# jackd on this appliance runs as root (system unit) and JACK's shared-memory
# transport is UID-scoped: clients running as another user (e.g. zynthian)
# get "jack server is not running" and every audio child (sfizz, mod-host,
# the python jack client) fails to connect. Run the app as root so all
# engine children share the JACK server's UID — same approach the stock
# zynthian-ui services use.
# Install to /etc/systemd/system/diakopad.service.d/runtime.conf
[Service]
User=root
