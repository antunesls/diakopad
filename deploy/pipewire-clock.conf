# Pins PipeWire's shared graph to a fixed sample rate and buffer size, so it
# never renegotiates mid-show. __QUANTUM__ is filled in by
# install-ubuntu-studio.sh: 128 frames (~2.9ms @ 44.1kHz) on the laptop - the
# validated low-latency setting for that rig (Ubuntu Studio + sfizz_jack +
# mod-host, set/2026) - and 256 frames (~5.8ms) on the Raspberry Pi
# (DIAKOPAD_QUANTUM overrides either). Installed to
# ~/.config/pipewire/pipewire.conf.d/99-diakopad-clock.conf - takes effect on
# the next `systemctl --user restart pipewire.service wireplumber.service`
# (see deploy/diakopad-restart.service). Confirm it actually applied with:
#   pw-metadata -n settings | grep clock
context.properties = {
    default.clock.rate          = 44100
    default.clock.allowed-rates = [ 44100 ]
    default.clock.quantum       = __QUANTUM__
    default.clock.min-quantum   = __QUANTUM__
    default.clock.max-quantum   = __QUANTUM__
}
